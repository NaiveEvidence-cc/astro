# Base44 sandbox stack for the Astro monorepo.
#
# `setup` installs the pnpm workspace and builds the `astro` package: the examples
# resolve `astro` to `packages/astro`, whose package exports point at `dist/`.
# `web` then serves one example (`examples/basics`) through Astro's dev server on
# the preview port. Both services run the bind-mounted working tree, so edits to
# example files are picked up live; edits to framework source need `setup` re-run.
name: astro

services:
  setup:
    build:
      context: .
      dockerfile: .base44/Dockerfile
    working_dir: /app
    environment:
      - CI=true
      - ASTRO_TELEMETRY_DISABLED=1
      - TURBO_TELEMETRY_DISABLED=1
    volumes:
      - .:/app
    command:
      - sh
      - -ec
      - pnpm install --frozen-lockfile && pnpm exec turbo run build --filter=astro

  web:
    build:
      context: .
      dockerfile: .base44/Dockerfile
    working_dir: /app
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: on-failure
    environment:
      - ASTRO_TELEMETRY_DISABLED=1
      - ASTRO_DISABLE_UPDATE_CHECK=true
      # Reachable from the preview proxy, which sends the sandbox hostname as the
      # host and the public host as the origin.
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    command:
      - sh
      - -ec
      - exec pnpm -C examples/basics exec astro dev --host 0.0.0.0 --port 3000 --allowed-hosts ".$${BASE44_SANDBOX_HOST_DOMAIN}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
